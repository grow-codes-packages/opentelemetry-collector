# Created by sdk-kit 0.1.0; owned by this repository.
# Consumer crate: uses the packaged crate like a user would (Docker replaces `..` with the
# unpacked `.crate`), runs the integration tests and the conformance runner.
[package]
name = "grow-opentelemetry-collector-integration"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
grow-opentelemetry-collector = { path = "..", features = ["testing", "blocking"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1.0.120"
async-trait = "0.1.80"
# Test-only read-back of the Jaeger sidecar and the capture files (same version as the SDK's).
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls-native-roots"] }

[workspace]
